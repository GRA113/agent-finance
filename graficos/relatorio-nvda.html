<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>NVDA — NVIDIA · Gráfico mensal</title>
<style>
  body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#94a3b8;font-size:13px;margin-bottom:18px}
  .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px 18px;max-width:840px;margin-bottom:18px}
  h2{font-size:16px;margin:0 0 4px}
  .legend{font-size:12px;color:#94a3b8;margin-bottom:4px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 14px;vertical-align:middle}
  .foot{font-size:11px;color:#64748b;margin-top:6px}
  svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<h1>NVDA — NVIDIA Corporation</h1>
<div class="sub">Cotação: 1 mês atrás (13/10/2026) vs. atual (13/11/2026) · fechamentos em USD</div>

<div class="card">
  <h2>NVDA — NVIDIA (NASDAQ)</h2>
  <div class="legend">
    <i style="background:#94a3b8"></i>13/10/2026 (1 mês atrás)
    <i style="background:#22c55e"></i>13/11/2026 — atual (alta)
    <i style="background:#ef4444"></i>13/11/2026 — atual (queda)
  </div>
  <div id="c1"></div>
  <div class="foot">Fonte: Yahoo Finance · fecho de 13/11/2026: US$ 162,85 (−28,7% no mês)</div>
</div>

<script>
function niceMax(v){
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  const steps = [1,1.25,1.5,2,2.5,3,4,5,6,8,10];
  const m = steps.find(s => n <= s + 1e-9) || 10;
  return m * p;
}
function fmtNum(v, cur){
  return cur + v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtPct(a,b){
  const p = (b/a - 1) * 100;
  return (p >= 0 ? '+' : '−') + Math.abs(p).toLocaleString('pt-BR',{maximumFractionDigits:1}) + '%';
}
function render(id, cfg){
  const items = cfg.items;
  const W = 760, padL = 78, padR = 26, padT = 50, padB = 66, plotH = 300;
  const plotW = W - padL - padR;
  const n = items.length;
  const groupW = plotW / n;
  const barW = Math.min(48, groupW * 0.3);
  const gap = Math.min(14, groupW * 0.08);
  const maxV = Math.max.apply(null, items.reduce((acc,i)=>acc.concat([i.prev,i.curr]),[]));
  const top = niceMax(maxV);
  const H = padT + plotH + padB;
  const y = v => padT + plotH - (v / top) * plotH;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial">';
  for (let k = 0; k <= 4; k++){
    const val = top * k / 4;
    const yy = y(val);
    s += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (W - padR) + '" y2="' + yy + '" stroke="#334155" stroke-width="1"/>';
    s += '<text x="' + (padL - 8) + '" y="' + (yy + 4) + '" fill="#94a3b8" font-size="11" text-anchor="end">' + val.toLocaleString('pt-BR',{maximumFractionDigits:0}) + '</text>';
  }
  items.forEach((it, i) => {
    const cx = padL + groupW * i + groupW / 2;
    const x1 = cx - gap / 2 - barW;
    const x2 = cx + gap / 2;
    const y1 = y(it.prev), y2 = y(it.curr);
    const up = it.curr >= it.prev;
    const c = up ? '#22c55e' : '#ef4444';
    s += '<rect x="' + x1 + '" y="' + y1 + '" width="' + barW + '" height="' + (padT + plotH - y1) + '" rx="3" fill="#94a3b8"/>';
    s += '<rect x="' + x2 + '" y="' + y2 + '" width="' + barW + '" height="' + (padT + plotH - y2) + '" rx="3" fill="' + c + '"/>';
    s += '<text x="' + (x1 + barW/2) + '" y="' + (y1 - 6) + '" fill="#cbd5e1" font-size="10.5" text-anchor="middle">' + fmtNum(it.prev, cfg.currency) + '</text>';
    s += '<text x="' + (x2 + barW/2) + '" y="' + (y2 - 6) + '" fill="' + c + '" font-size="10.5" font-weight="600" text-anchor="middle">' + fmtNum(it.curr, cfg.currency) + '</text>';
    const higher = Math.min(y1, y2);
    s += '<text x="' + cx + '" y="' + (higher - 24) + '" fill="' + c + '" font-size="13" font-weight="700" text-anchor="middle">' + fmtPct(it.prev, it.curr) + '</text>';
    s += '<text x="' + cx + '" y="' + (padT + plotH + 22) + '" fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">' + it.name + '</text>';
    if (it.sub) s += '<text x="' + cx + '" y="' + (padT + plotH + 38) + '" fill="#64748b" font-size="10.5" text-anchor="middle">' + it.sub + '</text>';
  });
  s += '<line x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (W - padR) + '" y2="' + (padT + plotH) + '" stroke="#475569" stroke-width="1.5"/>';
  s += '</svg>';
  document.getElementById(id).innerHTML = s;
}
render('c1', {
  currency: 'US$',
  items: [
    { name: 'NVDA', sub: 'NVIDIA · NASDAQ', prev: 228.52, curr: 162.85 }
  ]
});
</script>
</body>
</html>
